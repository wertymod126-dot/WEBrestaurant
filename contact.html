<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts and Booking | Yuzu Kitchen</title>
    
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
    <header id="main-header">
        <h1>Yuzu Kitchen</h1>
        <nav>
            <a href="index.html">Main</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Dishes</a>
            <a href="menu.html">Drinks</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="booking-block">

        <h2>Book a Table</h2>
        <p>Please fill the form below, and our manager will contact you to confirm the booking.</p>

       
        <form id="contact-form" action="#" method="POST">
            
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="hall">Choose Hall: </label>
                <select id="hall" name="hall" class="form-control">
                    <option value="main">Main Hall</option>
                    <option value="terrace">Summer-Terrace</option>
                    <option value="vip">VIP-Room</option>
                </select>
            </div>

            <div class="form-group">
                <label>Table Type:</label><br>
                <input type="radio" id="table2" name="table_type" value="2_persons" checked>
                <label for="table2" style="display:inline; font-weight:normal;">For Two</label><br>
                
                <input type="radio" id="table4" name="table_type" value="4_persons">
                <label for="table4" style="display:inline; font-weight:normal;">For four</label><br>
                
                <input type="radio" id="tableLarge" name="table_type" value="large">
                <label for="tableLarge" style="display:inline; font-weight:normal;">For Big Company</label>
            </div>

            <div class="form-group">
                <label for="message">Your Requests</label>
                <textarea id="message" name="message" rows="4" class="form-control" placeholder="For example: Allergies, Kids Table and ETC...."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
            
        </form>

    </main>

    
    <footer class="team-block">
        <p> Team Members: Adilbek Shangerey, Yerassyl Gabbas, Alizhan Rymkhan</p>
    </footer>
</body>
</html>
